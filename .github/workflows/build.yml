
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Tesseract
        run: choco install tesseract -y --no-progress

      - name: Bundle Tesseract
        shell: pwsh
        run: |
          $src = "C:\Program Files\Tesseract-OCR"
          New-Item -ItemType Directory -Force -Path "bundle\tesseract" | Out-Null
          Copy-Item "$src\*" "bundle\tesseract" -Recurse -Force

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name GarbageBot --add-data "bundle\tesseract;tesseract" garbage_bot.py

      - uses: actions/upload-artifact@v4
        with:
          name: GarbageBot-Windows-EXE
          path: dist/GarbageBot.exe
